@if (show) {
    <div class="fixed inset-0 bg-black/20 backdrop-blur-sm backdrop-brightness-75 transition-all flex items-center justify-center z-50">
        <div class="bg-white rounded shadow p-6 w-84">
            <h3 class="text-lg font-bold mb-4">{{ title || '¿Estás seguro?' }}</h3>
            <p class="mb-6">{{ message || 'Esta acción no se puede deshacer.' }}</p>
            <div class="flex justify-center gap-2 text-white">
                <button class="px-3 py-1 rounded border border-gray-800 text-gray-800 bg-white hover:bg-gray-800 hover:text-white transition-colors duration-200 shadow cursor-pointer" (click)="cancel()">Cancelar</button>
                <button class="px-3 py-1 rounded border border-red-500 text-red-500 bg-white hover:bg-red-500 hover:text-white transition-colors duration-200 shadow cursor-pointer" (click)="confirm()">Eliminar</button>
            </div>
        </div>
    </div>
}
