<div class="w-full flex flex-col items-center">

  <span (click)="togglePacientes()"
    class="flex w-full items-center p-2 rounded cursor-pointer bg-lightness-blue duration-200 hover:-translate-y-0.5 hover:shadow-md font-medium select-none"
    [ngClass]="isCollapsed ? 'justify-center' : 'justify-between'">
    <span class="material-icons-outlined">face</span>

    @if (!isCollapsed) {
    <span class="flex-1 ml-2 truncate text-left">
      {{ firstPatient || 'Selecciona un paciente' }}
    </span>

    <span class="material-icons-outlined transform transition-transform duration-200"
      [ngClass]="{ 'rotate-180': showPatients }">
      expand_more
    </span>
    }
  </span>

</div>

@if (showPatients && !isCollapsed) {
  <div
    class="absolute left-2 bottom-15 w-60 z-50 rounded text-gray-800 border border-gray-200 bg-white shadow-md flex flex-col overflow-hidden"
  >
    <!-- Encabezado -->
    <div class="flex items-center justify-between px-4 py-3 border-b border-gray-100">
      <span class="text-xs font-semibold">PACIENTES</span>
      <button
        class="material-icons-outlined p-1 rounded bg-lightness-blue duration-200 hover:-translate-y-0.5 hover:shadow-md"
        title="Agregar paciente"
        aria-label="Agregar paciente"
      >
        add
      </button>
    </div>

    <!-- Lista de pacientes -->
    <ul class="overflow-y-auto divide-y divide-gray-50">
      @for (paciente of patientsByUser; track paciente.id) {
        <li
          (click)="seleccionarPaciente(paciente.name)"
          class="flex items-center gap-2 px-4 py-2 cursor-pointer bg-lightness-blue text-sm"
        >
          <span class="material-icons-outlined">face</span>
          <span class="truncate">{{ paciente.name }}</span>
        </li>
      }

      @if (patientsByUser.length === 0) {
        <li class="py-4 text-xs text-gray-400 text-center">No hay pacientes</li>
      }
    </ul>
  </div>
}
