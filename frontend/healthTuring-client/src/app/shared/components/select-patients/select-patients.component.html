<div class="w-full flex flex-col items-center">
  <span
    (click)="togglePacientes()"
    class="flex items-center gap-2 w-full p-2 rounded cursor-pointer transition profile-border font-medium hover:bg-gray-100"
    [ngClass]="{ 'justify-center': isCollapsed, 'justify-between': !isCollapsed }"
  >
    <span class="material-icons-outlined">face</span>
    @if (!isCollapsed) {
      <span class="truncate flex-1 text-left">{{ firstPatient || 'Selecciona un paciente' }}</span>
      <span class="material-icons-outlined transition-transform duration-200" [ngClass]="{ 'rotate-180': showPatients }">expand_more</span>
    }
  </span>
</div>

@if (showPatients && !isCollapsed) {
  <div
    class="absolute left-2 right-2 bottom-20 w-[calc(100%-16px)] max-h-80 bg-white rounded shadow-xl z-50 flex flex-col border border-gray-100"
    style="min-width: 15rem;"
  >
    <div class="px-4 pt-4 pb-2 flex items-center justify-between">
      <span class="text-xs font-semibold text-gray-500">PACIENTES</span>
      <button class="material-icons-outlined text-primary hover:bg-gray-100 rounded p-1" title="Agregar paciente">add</button>
    </div>
    <ul class="overflow-y-auto max-h-56 px-2">
      @for (paciente of patientsByUser; track paciente.id) {
        <li
          (click)="seleccionarPaciente(paciente.name)"
          class="flex items-center gap-2 py-2 px-2 rounded hover:bg-gray-100 transition cursor-pointer"
        >
          <span class="material-icons-outlined text-gray-500">face</span>
          <span class="text-sm truncate">{{ paciente.name }}</span>
        </li>
      }
      @if (patientsByUser.length === 0) {
        <li class="py-4 text-xs text-gray-400 text-center">No hay pacientes</li>
      }
    </ul>
  </div>
}
