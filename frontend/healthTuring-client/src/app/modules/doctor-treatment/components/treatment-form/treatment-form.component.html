<!-- Modal Overlay con fondo blur -->
<div class="fixed inset-0 z-50 flex items-center justify-center
            bg-black/20 backdrop-blur-sm backdrop-brightness-75 transition-all">
  <!-- Modal Dialog -->
  <div class="relative w-full max-w-xl mx-2 sm:mx-auto">
    <form
      [formGroup]="treatmentForm"
      class="bg-white rounded-lg shadow-lg p-4 sm:p-6 space-y-6 max-h-[95vh] overflow-y-auto"
      (ngSubmit)="onSubmit($event)"
    >
      <!-- Botón cerrar arriba a la derecha -->
      <button
        type="button"
        (click)="closeModal()"
        class="absolute top-3 right-3 text-gray-400 hover:text-gray-800 text-2xl"
        aria-label="Cerrar"
      >
        &times;
      </button>
      <h2 class="text-2xl font-bold mb-4 text-center">Crear Tratamiento</h2>

      <!-- Ejemplo del campo Nombre -->
      <div>
        <label for="reason" class="block text-sm font-medium text-gray-700 mb-1">Motivo del tratamiento</label>
        <input
          formControlName="reason"
          type="text"
          class="w-full border border-gray-300 rounded-md p-2 focus:outline-none focus:ring-2 focus:ring-blue-500"
          placeholder="Introduce el motivo"
        />
      </div>
      <!-- Fechas -->
      <div class="flex flex-col md:flex-row md:space-x-4 space-y-4 md:space-y-0">
        <div class="flex-1">
          <label for="startDate" class="block text-sm font-medium text-gray-700 mb-1">Fecha de inicio</label>
          <input
            formControlName="startDate"
            type="date"
            class="w-full border border-gray-300 rounded-md p-2 focus:outline-none focus:ring-2 focus:ring-blue-500"
          />
        </div>
        <div class="flex-1">
          <label for="endDate" class="block text-sm font-medium text-gray-700 mb-1">Fecha de fin</label>
          <input
            formControlName="endDate"
            type="date"
            class="w-full border border-gray-300 rounded-md p-2 focus:outline-none focus:ring-2 focus:ring-blue-500"
          />
        </div>
      </div>
      <!-- Dosis por periodo -->
      <div>
        <label for="dosesPerPeriod" class="block text-sm font-medium text-gray-700 mb-1">Dosis por periodo</label>
        <input
          formControlName="dosesPerPeriod"
          type="text"
          class="w-full border border-gray-300 rounded-md p-2 focus:outline-none focus:ring-2 focus:ring-blue-500"
          placeholder="Ej: 2 por día"
        />
      </div>
      <!-- Paciente -->
      <div>
        <label for="patientId" class="block text-sm font-medium text-gray-700 mb-1">Paciente</label>
        <select
          formControlName="patientId"
          class="w-full border border-gray-300 rounded-md p-2 focus:outline-none focus:ring-2 focus:ring-blue-500"
        >
          <option value="">Selecciona un paciente</option>
          <option *ngFor="let patient of patients" [value]="patient.id">
            {{ patient.name }}
          </option>
        </select>
      </div>
      <!-- Medicamento -->
      <div>
        <label for="medicamentId" class="block text-sm font-medium text-gray-700 mb-1">Medicamento</label>
        <select
          formControlName="medicamentId"
          class="w-full border border-gray-300 rounded-md p-2 focus:outline-none focus:ring-2 focus:ring-blue-500"
        >
          <option value="">Selecciona un medicamento</option>
          <option *ngFor="let medicament of medicaments" [value]="medicament.id">
            {{ medicament.commonName }} ({{ medicament.strength }} {{ medicament.dosageForm }})
          </option>
        </select>
      </div>
      <div class="pt-4">
        <button
          type="submit"
          class="w-full bg-primary text-white font-semibold py-2 px-4 rounded shadow"
        >
          Guardar tratamiento
        </button>
      </div>
    </form>
  </div>
</div>
