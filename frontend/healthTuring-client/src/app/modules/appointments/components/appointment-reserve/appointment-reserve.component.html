<div class="max-w-md mx-auto mt-10 bg-white rounded shadow p-8 space-y-6 border border-gray-200">
  <h2 class="text-2xl font-bold text-gray-800 mb-6 text-center">Registro de Cita</h2>

  <div class="flex flex-col space-y-2">
    <label class="block text-sm font-medium text-gray-700 mb-1" for="date">Fecha</label>
    <input
      id="date"
      type="date"
      [(ngModel)]="date"
      [min]="minDate"
      [max]="maxDate"
      (change)="onDateChange()"
      class="w-full border rounded p-2 focus:outline-none group__input"
    />
    <span class="text-xs text-gray-400">Solo puedes reservar entre {{ formatDate(minDate) }} y {{ formatDate(maxDate) }}</span>
  </div>

  <div *ngIf="slots.length > 0" class="flex flex-col space-y-2">
    <label class="block text-sm font-medium text-gray-700 mb-1" for="slot">Selecciona una hora</label>
    <select
      id="slot"
      [(ngModel)]="selectedSlot"
      class="w-full border rounded p-2 focus:outline-none group__input"
    >
      <option *ngFor="let slot of slots" [value]="slot">{{ slot | slice:0:5 }}</option>
    </select>
  </div>

  <div *ngIf="slots.length === 0 && date" class="text-center text-red-500 font-medium">
    <p>No hay horarios disponibles en esta fecha</p>
  </div>

  <div class="flex flex-col space-y-2">
    <label class="block text-sm font-medium text-gray-700 mb-1" for="reason">Motivo</label>
    <input
      id="reason"
      type="text"
      [(ngModel)]="reason"
      placeholder="Motivo de la cita"
      maxlength="100"
      class="w-full border rounded p-2 focus:outline-none group__input"
    />
  </div>

  <button
    (click)="reserve()"
    class="w-full bg-primary text-white font-bold py-2 px-4 rounded shadow transition duration-150 cursor-pointer disabled:cursor-not-allowed"
    [disabled]="!date || !selectedSlot"
  >
    Reservar
  </button>
</div>
