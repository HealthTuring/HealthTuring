name: Deploy HealthTuring Fullstack

on:
  push:
    branches:
      - prod

jobs:
  build:
    name: Build Angular & Spring Boot
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '22.16.0'

    - name: Build Angular App
      run: |
        cd frontend/healthTuring-client
        npm install
        npm run build -- --configuration production

    - name: Verificar salida de Angular
      run: find frontend/healthTuring-client/dist -type f

    - name: Setup Java and Maven
      uses: actions/setup-java@v3
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Build Spring Boot App
      run: |
        cd backend/healthturing-server
        chmod +x mvnw
        ./mvnw clean package -DskipTests

    - name: Verificar salida de Spring Boot
      run: find backend/healthturing-server/target -type f

  deploy-test:
    name: Confirm build output
    needs: build
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v3

    - name: Mostrar estructura post-build
      run: |
        echo "Verificando si los archivos .jar y dist existen"
        find . -type f | grep -E 'target/.*\\.jar|dist/.*\\.js'
