name: Deploy HealthTuring Fullstack

on:
  push:
    branches:
      - prod

jobs:
  build-and-deploy:
    name: Build and Deploy Fullstack
    runs-on: ubuntu-latest

    strategy:
      matrix:
        frontend_host: [3.95.121.200, 3.223.83.168]
        backend_host: [52.202.49.64, 184.73.19.56]
        exclude:
          - frontend_host: 3.95.121.200
            backend_host: 52.202.49.64
          - frontend_host: 3.223.83.168
            backend_host: 184.73.19.56

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '22.16.0'

    - name: Build Angular App
      run: |
        cd frontend/healthTuring-client
        npm install
        npm run build -- --configuration production

    - name: Setup Java and Maven
      uses: actions/setup-java@v3
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Build Spring Boot App
      run: |
        cd backend/healthturing-server
        chmod +x mvnw
        ./mvnw clean package -DskipTests

    - name: Preparar permisos en carpeta destino (frontend)
      if: matrix.frontend_host != ''
      uses: appleboy/ssh-action@v0.1.10
      with:
        host: ${{ matrix.frontend_host }}
        username: ubuntu
        key: ${{ secrets.AWS_SSH_KEY }}
        script: |
          sudo rm -rf /home/ubuntu/frontend-dist
          sudo mkdir -p /home/ubuntu/frontend-dist
          sudo chown -R ubuntu:ubuntu /home/ubuntu/frontend-dist

    - name: Subir Angular build a EC2 (frontend)
      if: matrix.frontend_host != ''
      uses: appleboy/scp-action@v0.1.6
      with:
        host: ${{ matrix.frontend_host }}
        username: ubuntu
        key: ${{ secrets.AWS_SSH_KEY }}
        source: "frontend/healthTuring-client/dist/health-turing-client/browser/**"
        target: "/home/ubuntu/frontend-dist"

    - name: Deploy Angular App en NGINX
      if: matrix.frontend_host != ''
      uses: appleboy/ssh-action@v0.1.10
      with:
        host: ${{ matrix.frontend_host }}
        username: ubuntu
        key: ${{ secrets.AWS_SSH_KEY }}
        script: |
          sudo rm -rf /var/www/html/*
          sudo cp -r /home/ubuntu/frontend-dist/* /var/www/html/
          sudo chown -R www-data:www-data /var/www/html
          sudo chmod -R 755 /var/www/html
          sudo systemctl restart nginx

    - name: Subir Spring Boot JAR a EC2 (backend)
      if: matrix.backend_host != ''
      uses: appleboy/scp-action@v0.1.6
      with:
        host: ${{ matrix.backend_host }}
        username: ubuntu
        key: ${{ secrets.AWS_SSH_KEY }}
        source: "backend/healthturing-server/target/*.jar"
        target: "/home/ubuntu/app.jar"

    - name: Reiniciar Spring Boot en EC2
      if: matrix.backend_host != ''
      uses: appleboy/ssh-action@v0.1.10
      with:
        host: ${{ matrix.backend_host }}
        username: ubuntu
        key: ${{ secrets.AWS_SSH_KEY }}
        script: |
          pkill -f 'java.*app.jar' || true
          nohup java -jar /home/ubuntu/app.jar > backend.log 2>&1 &
