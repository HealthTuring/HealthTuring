name: Test Angular SCP Upload

on:
  push:
    branches:
      - prod
  workflow_dispatch:

jobs:
  test-upload:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repo
      uses: actions/checkout@v3

    - name: Setup Node
      uses: actions/setup-node@v3
      with:
        node-version: '22.16.0'

    - name: Build Angular
      run: |
        cd frontend/healthTuring-client
        npm install
        npm run build -- --configuration production

    - name: Upload Angular to EC2 (TEST ONLY)
      uses: appleboy/scp-action@v0.1.6
      with:
        host: ${{ secrets.TEST_FRONTEND_HOST }}
        username: ubuntu
        key: ${{ secrets.AWS_SSH_KEY }}
        source: "frontend/healthTuring-client/dist/health-turing-client/browser/**"
        target: "/home/ubuntu/test-nginx"

    - name: List uploaded files
      uses: appleboy/ssh-action@v0.1.10
      with:
        host: ${{ secrets.TEST_FRONTEND_HOST }}
        username: ubuntu
        key: ${{ secrets.AWS_SSH_KEY }}
        script: |
          echo "Contenido recibido en /home/ubuntu/test-nginx:"
          ls -lah /home/ubuntu/test-nginx
