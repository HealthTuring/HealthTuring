name: Test Backend Deploy

on:
  workflow_dispatch:

jobs:
  backend-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Setup Java and Maven
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Build Spring Boot
        run: |
          cd backend/healthturing-server
          chmod +x mvnw
          ./mvnw clean package -DskipTests

      - name: Upload Spring Boot JAR to EC2 (TEST)
        uses: appleboy/scp-action@v0.1.6
        with:
          host: ${{ secrets.BACKEND_HOST }}
          username: ubuntu
          key: ${{ secrets.AWS_SSH_KEY }}
          source: "backend/healthturing-server/target/healthturing-server-0.0.1-SNAPSHOT.jar"
          target: "/home/ubuntu/"

      - name: Run Spring Boot JAR in EC2
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.BACKEND_HOST }}
          username: ubuntu
          key: ${{ secrets.AWS_SSH_KEY }}
          script: |
            pkill -f 'java.*healthturing-server-0.0.1-SNAPSHOT.jar' || true
            nohup java -jar /home/ubuntu/healthturing-server-0.0.1-SNAPSHOT.jar > backend.log 2>&1 &
            sleep 3
            pgrep -af java || echo "⚠️ No java process running"
