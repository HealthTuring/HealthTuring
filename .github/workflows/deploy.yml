name: Step 1 - Build Frontend and Backend (Verify paths only)

on:
  workflow_dispatch:  # Lo ejecutas manualmente desde GitHub

jobs:
  build-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '22.2.0'

      - name: Build Angular App
        run: |
          cd frontend/healthTuring-client
          npm install
          npm run build -- --configuration production

      - name: List Angular dist content
        run: |
          echo "📂 Verificando dist generado"
          ls -lh frontend/healthTuring-client/dist/health-turing-client/browser

      - name: Setup Java and Maven
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Build Spring Boot App
        run: |
          cd backend/healthturing-server
          chmod +x mvnw
          ./mvnw clean package -DskipTests

      - name: List JAR generated
        run: |
          echo "📦 Verificando JAR generado"
          ls -lh backend/healthturing-server/target
