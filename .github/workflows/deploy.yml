name: Deploy HealthTuring Fullstack

on:
  push:
    branches:
      - prod

jobs:
  build:
    name: Build Angular & Spring Boot
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '22.16.0'

    - name: Build Angular App
      run: |
        cd HealthTuring/frontend/healthTuring-client
        npm install
        npm run build -- --configuration production

    - name: Setup Java and Maven
      uses: actions/setup-java@v3
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Build Spring Boot App
      run: |
        cd HealthTuring/backend/healthturing-server
        chmod +x mvnw
        ./mvnw clean package -DskipTests

  deploy-frontend:
    name: Deploy to Frontend Instances
    needs: build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        host:
          - 3.95.121.200
          - 3.223.83.168

    steps:
    - name: Verificar contenido de dist/Angular
      run: ls -lhR HealthTuring/frontend/healthTuring-client/dist/health-turing-client/

    - name: Upload Angular build to EC2
      uses: appleboy/scp-action@v0.1.6
      with:
        host: ${{ secrets.AWS_HOST }}
        username: ubuntu
        key: ${{ secrets.AWS_SSH_KEY }}
        source: "HealthTuring/frontend/healthTuring-client/dist/health-turing-client/**"
        target: "/home/ubuntu/frontend-dist"

    - name: Deploy Angular App to NGINX
      uses: appleboy/ssh-action@v0.1.10
      with:
        host: ${{ matrix.host }}
        username: ubuntu
        key: ${{ secrets.AWS_SSH_KEY }}
        script: |
          sudo rm -rf /var/www/html/*
          sudo cp -r /home/ubuntu/frontend-dist/* /var/www/html/
          sudo chown -R www-data:www-data /var/www/html
          sudo chmod -R 755 /var/www/html
          sudo systemctl restart nginx

  deploy-backend:
    name: Deploy to Backend Instances
    needs: build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        host:
          - 52.202.49.64
          - 184.73.19.56

    steps:
    - name: Verificar archivos JAR generados
      run: ls -lhR HealthTuring/backend/healthturing-server/target/

    - name: Upload Spring Boot JAR to EC2
      uses: appleboy/scp-action@v0.1.6
      with:
        host: ${{ matrix.host }}
        username: ubuntu
        key: ${{ secrets.AWS_SSH_KEY }}
        source: "HealthTuring/backend/healthturing-server/target/*.jar"
        target: "/home/ubuntu/app.jar"

    - name: Restart Spring Boot App
      uses: appleboy/ssh-action@v0.1.10
      with:
        host: ${{ matrix.host }}
        username: ubuntu
        key: ${{ secrets.AWS_SSH_KEY }}
        script: |
          pkill -f 'java.*app.jar' || true
          nohup java -jar /home/ubuntu/app.jar > backend.log 2>&1 &
