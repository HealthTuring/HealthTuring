name: Deploy HealthTuring Fullstack (Build Test)

on:
  push:
    branches:
      - prod

jobs:
  build:
    name: Build Angular & Spring Boot
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '22.16.0'

    - name: Build Angular App
      run: |
        cd frontend/healthTuring-client
        npm install
        npm run build -- --configuration production

    - name: Verificar salida de Angular
      run: find frontend/healthTuring-client/dist -type f || echo "⚠️ No hay archivos en dist"

    - name: Setup Java and Maven
      uses: actions/setup-java@v3
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Build Spring Boot App
      run: |
        cd backend/healthturing-server
        chmod +x mvnw
        ./mvnw clean package -DskipTests

    - name: Verificar salida de Spring Boot
      run: find backend/healthturing-server/target -type f || echo "⚠️ No hay archivos en target"

    - name: Mostrar todos los archivos generados
      run: |
        echo "🗂 Todos los archivos generados:"
        find . -type f | sort || true

  deploy-test:
    name: Confirm build output
    needs: build
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repo
      uses: actions/checkout@v3

    - name: Confirmar estructura del workspace
      run: |
        echo "📦 Archivos esperados:"
        find . -type f | grep -E 'target/.*\\.jar|dist/.*\\.(js|html)' || echo \"⚠️ No se encontraron .jar o archivos de Angular\"
