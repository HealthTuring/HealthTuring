name: Deploy HealthTuring Fullstack

on:
  push:
    branches:
      - prod

jobs:
  build-and-deploy:
    name: Build and Deploy Fullstack
    runs-on: ubuntu-latest

    strategy:
      matrix:
        frontend_host: [3.95.121.200, 3.223.83.168]
        backend_host: [52.202.49.64, 184.73.19.56]
        exclude:
          - frontend_host: 3.95.121.200
            backend_host: 52.202.49.64
          - frontend_host: 3.223.83.168
            backend_host: 184.73.19.56

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      # ✅ PRUEBA 1: Verificar estructura tras checkout
      - name: Confirmar estructura tras checkout
        run: ls -R

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '22.2.0'

      - name: Build Angular
        run: |
          cd frontend/healthTuring-client
          npm install
          npm run build -- --configuration production

      # ✅ PRUEBA 2: Confirmar artefactos Angular
      - name: Verificar dist Angular generado
        run: ls -lh frontend/healthTuring-client/dist/health-turing-client/browser/

      - name: Setup Java and Maven
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Build Spring Boot
        run: |
          cd backend/healthturing-server
          chmod +x mvnw
          ./mvnw clean package -DskipTests
          cp target/healthturing-server-0.0.1-SNAPSHOT.jar ../../app.jar

      # ✅ PRUEBA 2: Confirmar artefacto JAR
      - name: Verificar JAR generado
        run: ls -lh backend/healthturing-server/target/

      - name: Upload Angular build to EC2 (frontend)
        uses: appleboy/scp-action@v0.1.6
        with:
          host: ${{ matrix.frontend_host }}
          username: ubuntu
          key: ${{ secrets.AWS_SSH_KEY }}
          source: "frontend/healthTuring-client/dist/health-turing-client/browser/*"
          target: "/home/ubuntu/frontend-dist"

      # ✅ PRUEBA 3: Verificar archivos subidos a EC2 (frontend)
      - name: Verificar archivos frontend en EC2
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ matrix.frontend_host }}
          username: ubuntu
          key: ${{ secrets.AWS_SSH_KEY }}
          script: ls -lh /home/ubuntu/frontend-dist

      - name: Deploy Angular App to NGINX
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ matrix.frontend_host }}
          username: ubuntu
          key: ${{ secrets.AWS_SSH_KEY }}
          script: |
            sudo rm -rf /var/www/html/*
            sudo cp -r /home/ubuntu/frontend-dist/* /var/www/html/
            sudo chown -R www-data:www-data /var/www/html
            sudo chmod -R 755 /var/www/html
            sudo systemctl restart nginx

      # ✅ PRUEBA 6: Validar contenido final en NGINX
      - name: Verificar contenido NGINX
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ matrix.frontend_host }}
          username: ubuntu
          key: ${{ secrets.AWS_SSH_KEY }}
          script: |
            ls -lh /var/www/html
            head -n 10 /var/www/html/index.html

      - name: Upload Spring Boot JAR to EC2 (backend)
        uses: appleboy/scp-action@v0.1.6
        with:
          host: ${{ matrix.backend_host }}
          username: ubuntu
          key: ${{ secrets.AWS_SSH_KEY }}
          source: "app.jar"
          target: "/home/ubuntu/app.jar"

      # ✅ PRUEBA 3: Verificar JAR subido
      - name: Verificar app.jar en EC2
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ matrix.backend_host }}
          username: ubuntu
          key: ${{ secrets.AWS_SSH_KEY }}
          script: ls -lh /home/ubuntu/app.jar

      - name: Restart Spring Boot App
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ matrix.backend_host }}
          username: ubuntu
          key: ${{ secrets.AWS_SSH_KEY }}
          script: |
            pkill -f 'java.*app.jar' || true
            nohup java -jar /home/ubuntu/app.jar > backend.log 2>&1 &

      # ✅ PRUEBA 5: Verificar proceso Java en EC2
      - name: Verificar proceso Java backend
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ matrix.backend_host }}
          username: ubuntu
          key: ${{ secrets.AWS_SSH_KEY }}
          script: ps aux | grep java || echo "No hay procesos Java"

      # ✅ PRUEBA EXTRA: Ver último log del backend
      - name: Ver último log de backend
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ matrix.backend_host }}
          username: ubuntu
          key: ${{ secrets.AWS_SSH_KEY }}
          script: tail -n 50 /home/ubuntu/backend.log || echo "No log generado"
