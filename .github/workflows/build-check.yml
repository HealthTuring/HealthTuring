name: Build and Deploy Fullstack

on:
  push:
    branches:
      - prod

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '22.2.0'

      - name: Build Angular
        run: |
          cd frontend/healthTuring-client
          npm install
          npm run build -- --configuration production

      - name: Show Angular dist contents
        run: ls -lh frontend/healthTuring-client/dist/health-turing-client/browser

      - name: Setup Java and Maven
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Build Spring Boot
        run: |
          cd backend/healthturing-server
          chmod +x mvnw
          ./mvnw clean package -DskipTests

      - name: Show JAR generated
        run: ls -lh backend/healthturing-server/target

      - name: Upload Angular dist to EC2
        uses: appleboy/scp-action@v0.1.6
        with:
          host: ${{ secrets.AWS_FRONTEND_HOST }}
          username: ubuntu
          key: ${{ secrets.AWS_SSH_KEY }}
          source: "frontend/healthTuring-client/dist/health-turing-client/browser/*"
          target: "/home/ubuntu/frontend-dist"

      - name: Upload Spring Boot JAR to EC2
        uses: appleboy/scp-action@v0.1.6
        with:
          host: ${{ secrets.AWS_BACKEND_HOST }}
          username: ubuntu
          key: ${{ secrets.AWS_SSH_KEY }}
          source: "backend/healthturing-server/target/healthturing-server-0.0.1-SNAPSHOT.jar"
          target: "/home/ubuntu/app.jar"

      - name: Restart Spring Boot App (via screen)
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.AWS_BACKEND_HOST }}
          username: ubuntu
          key: ${{ secrets.AWS_SSH_KEY }}
          script: |
            echo "🔁 Reiniciando Spring Boot"

            if ! command -v java > /dev/null; then
              echo "❌ Java no está instalado en la instancia"
              exit 1
            fi

            if [ ! -f /home/ubuntu/app.jar ]; then
              echo "❌ El archivo app.jar no existe en /home/ubuntu"
              exit 1
            fi

            pkill -f 'java.*app.jar' || true
            nohup java -jar /home/ubuntu/app.jar > backend.log 2>&1 &
            sleep 5

            if pgrep -f app.jar > /dev/null; then
              echo "✅ Spring Boot arrancado correctamente"
            else
              echo "❌ Spring Boot no arrancó. Mostrando backend.log:"
              cat backend.log
              exit 1
            fi
