#Import Common config
spring.config.import=application-common.properties

#Url front
url.client=http://localhost:4200

#BD Config cambiar ip
spring.datasource.url=jdbc:mysql://ip:3306/HealthTuring
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASS}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

#CORS allowed
cors.allowedOrigins=http://localhost:4200

# Config Hibernate
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update

# Configuración de logs (más detallada en desarrollo)
# logging.level.org.hibernate.SQL=DEBUG
# logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE