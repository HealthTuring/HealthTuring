<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>View Substance</title>
</head>

<body class="flex flex-col min-h-screen">
    <div th:replace="shared/header :: header"></div>

    <div class="container mx-auto px-4 flex-grow">
        <div class="flex flex-col shadow bg-white text-gray-800 rounded border border-gray-200
                transition-transform duration-300 hover:scale-102 w-full
                max-w-xs sm:max-w-sm md:max-w-md lg:max-w-xs h-full min-w-2xs min-h-50 p-6 m-2">
            <h3 class="text-lg font-bold mb-3" th:text="${substance.name}"></h3>
            <div class="rounded p-3 mt-2 text-sm space-y-1">
                <p><span class="font-semibold">ID:</span> <span th:text="${substance.id}"></span></p>
                <p><span class="font-semibold">Name:</span> <span th:text="${substance.name}"></span></p>
            </div>
            <a class="bg-gray-300 text-center hover:bg-gray-400 text-black font-bold py-2 px-4 mt-4 rounded inline-block w-20" href="/substances">Back</a>
        </div>


    </div>

    <div th:replace="shared/footer :: footer"></div>
</body>

</html>
